<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melvet &amp; Rockson</title>
<meta name="description" content="Melvet Gonsalves &amp; Rockson D'souza invite you to celebrate their wedding on Saturday, 28 November 2026, at Infant Jesus Church, Dombivli.">
<meta property="og:title" content="Melvet &amp; Rockson · You are invited">
<meta property="og:description" content="Saturday, 28 November 2026 · Holy Mass 4:30 PM · Infant Jesus Church, Dombivli">
<meta name="theme-color" content="#bed3de">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

<script>document.documentElement.classList.add("js"); document.body.classList.add("is-loading");</script>

<!-- Shared paint: gradients, filters and patterns used by every envelope part -->
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f5ec"/><stop offset=".55" stop-color="#f2eee3"/><stop offset="1" stop-color="#e9e3d5"/>
    </linearGradient>
    <linearGradient id="g-side-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e0d1"/><stop offset="1" stop-color="#f1ede3"/>
    </linearGradient>
    <linearGradient id="g-side-r" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e3ddcd"/><stop offset="1" stop-color="#efebe0"/>
    </linearGradient>
    <linearGradient id="g-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2e9"/><stop offset="1" stop-color="#ebe5d7"/>
    </linearGradient>
    <linearGradient id="g-throat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2414" stop-opacity=".34"/><stop offset="1" stop-color="#2a2414" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-seal" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#3a78b5"/><stop offset=".35" stop-color="#1b4f88"/><stop offset=".75" stop-color="#0c2c61"/><stop offset="1" stop-color="#061a3f"/>

    <radialGradient id="g-seal-in" cx=".62" cy=".68" r=".75">
      <stop offset="0" stop-color="#1c5290"/><stop offset=".6" stop-color="#0f3570"/><stop offset="1" stop-color="#0a2652"/>
    </radialGradient>
    <linearGradient id="g-seal-lip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051431"/><stop offset=".5" stop-color="#0c2c61" stop-opacity="0"/><stop offset="1" stop-color="#6d9fd0"/>
    </linearGradient>
    <linearGradient id="g-seal-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc3ea" stop-opacity=".9"/><stop offset=".45" stop-color="#9cc3ea" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>

    <pattern id="p-grain" patternUnits="userSpaceOnUse" width="220" height="220">
      <image data-grain width="220" height="220" href=""/>
    </pattern>
    <pattern id="p-damask" patternUnits="userSpaceOnUse" width="70" height="98">
      <rect width="70" height="98" fill="#c3d7e3"/>
      <image data-damask width="70" height="98" href=""/>
    </pattern>
    <filter id="f-lace" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#4d4430" flood-opacity=".32"/>
    </filter>
    <filter id="f-fold" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#5b5136" flood-opacity=".2"/>
    </filter>
    <filter id="f-flap" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#4d4430" flood-opacity=".22"/>
    </filter>
    <filter id="f-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="f-blur-s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="c-env"><rect width="1000" height="704"/></clipPath>
    <path id="arc-hint" d="M362 505 A138 138 0 0 0 638 505"/>
  </defs>
</svg>

<div class="backdrop" aria-hidden="true"><div class="backdrop-pattern"></div><div class="backdrop-tint"></div></div>

<main class="scene">
  <div class="stage" data-stage>
    <div class="cover">
      <canvas class="satin" data-satin aria-hidden="true"></canvas>
      <div class="tulle" aria-hidden="true"></div>
      <svg class="rosettes" data-rosettes viewBox="0 0 1000 1778" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="band" aria-hidden="true"></div>
      <svg class="band-lace" data-band-lace viewBox="0 0 1000 1778" preserveAspectRatio="none" aria-hidden="true"></svg>

      <div class="env" data-env aria-hidden="true">
        <div class="env-shadow"></div>
        <!-- inside of the envelope: lined with the same damask -->
        <svg class="env-layer env-inside" viewBox="0 0 1000 704">
          <rect width="1000" height="704" fill="#e8e1d1"/>
          <rect x="34" y="20" width="932" height="660" rx="6" fill="url(#p-damask)"/>
          <rect x="34" y="20" width="932" height="660" rx="6" fill="none" stroke="#bab7b8" stroke-width="2"/>
          <rect width="1000" height="704" fill="url(#p-grain)" opacity=".5"/>
          <rect width="1000" height="200" fill="url(#g-throat)"/>
        </svg>
        <div class="pocket"><div class="pocket-card" data-pocket-card></div></div>
        <!-- front of the envelope: side flaps and bottom flap -->
        <svg class="env-layer env-front" viewBox="0 0 1000 704">
          <path d="M1000 0 L488 418 Q474 430 488 442 L1000 704 Z" fill="url(#g-side-r)"/>

          <path d="M3 703 L434 479 Q500 446 566 479 L997 703" stroke="#fffdf6" stroke-width="1.6" opacity=".7" fill="none"/>
          <text class="hint-text" data-hint-text><textPath href="#arc-hint" startOffset="50%" text-anchor="middle">Click to open</textPath></text>
        </svg>
        <div class="flap" data-flap>
          <svg class="flap-face flap-face--front" viewBox="0 0 1000 704" data-flap-front>
            <path d="M0 0 L1000 0 L500 522 Z" fill="url(#g-flap)" filter="url(#f-flap)"/>
            <path d="M0 0 L1000 0 L500 522 Z" fill="url(#p-grain)" opacity=".6"/>
            <g data-lace clip-path="url(#c-env)" filter="url(#f-lace)"></g>
            <text class="invited" x="500" y="232" text-anchor="middle">You are invited !</text>
            <g data-seal></g>
          </svg>
          <svg class="flap-face flap-face--back" viewBox="0 0 1000 704">
            <path d="M0 0 L1000 0 L500 522 Z" fill="#ece6d7"/>
            <path d="M40 0 L960 0 L500 478 Z" fill="url(#p-damask)"/>
            <path d="M40 0 L960 0 L500 478 Z" fill="none" stroke="#bab7b8" stroke-width="2"/>
            <path d="M0 0 L1000 0 L500 522 Z" fill="url(#p-grain)" opacity=".45"/>
            <g data-lace clip-path="url(#c-env)" filter="url(#f-lace)"></g>
          </svg>
        </div>
        <span class="seal-hint" data-seal-hint><span class="seal-glint"></span></span>
      </div>

      <h1 class="cover-names">
        <span class="cn cn--1">Melvet</span>
        <span class="cn cn--amp">&amp;</span>
        <span class="cn cn--2">Rockson</span>
      </h1>
    </div>
    <button type="button" class="open-btn" data-open aria-label="Open the invitation"></button>
  </div>

            <p class="c-ref">Song of Solomon <span>3:4</span></p>
            <p class="c-presence">In the presence of our family, friends &amp; relatives</p>
            <p class="c-we">We</p>

              <span class="c-pill"><b>28</b><i>Nov</i></span>
              <span class="c-side">7 PM</span>
            </div>
            <p class="c-caps c-mass">Holy Mass 4:30 PM</p>

            <a class="c-loc" data-map target="_blank" rel="noopener">Click <b>HERE</b> for location</a>

        <h1 class="script" data-step style="--d:1" data-count-title>Until we say I do</h1>

          <div class="unit"><span class="num" data-unit="days">--</span><span class="lbl">Days</span></div>
          <span class="rule" aria-hidden="true"></span>
          <div class="unit"><span class="num" data-unit="hours">--</span><span class="lbl">Hours</span></div>
          <span class="rule" aria-hidden="true"></span>
          <div class="unit"><span class="num" data-unit="minutes">--</span><span class="lbl">Minutes</span></div>
          <span class="rule" aria-hidden="true"></span>
