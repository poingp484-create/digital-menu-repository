<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melvet &amp; Rockson</title>
<meta name="description" content="Melvet Gonsalves &amp; Rockson D'souza invite you to celebrate their wedding on Saturday, 28 November 2026, at Infant Jesus Church, Dombivli.">
<meta property="og:title" content="Melvet &amp; Rockson · You are invited">
<meta property="og:description" content="Saturday, 28 November 2026 · Holy Mass 4:30 PM · Infant Jesus Church, Dombivli">
<meta name="theme-color" content="#bed3de">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<script>document.documentElement.classList.add("js");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap">
<link rel="preload" as="image" href="assets/img/cover.webp" type="image/webp">
<link rel="preload" as="image" href="assets/img/bg.webp" type="image/webp">
<link rel="stylesheet" href="assets/css/card.css">
</head>
<body class="is-loading">
<!--CONTENT-START-->

<div class="backdrop" aria-hidden="true">
  <div class="backdrop-layer backdrop-layer--cover"></div>
  <div class="backdrop-layer backdrop-layer--invite"></div>
  <div class="backdrop-tint"></div>
</div>

<main class="scene">
  <!-- Closed envelope: the cover exactly as designed. The envelope layers only appear once it is opened. -->
  <div class="stage" data-stage>
    <img class="bg-img" src="assets/img/bg.webp" width="1440" height="2560" alt="">
    <img class="cover-img" src="assets/img/cover.webp" width="1440" height="2560" alt="Envelope sealed with a wax seal monogrammed R M, reading You are invited, above the names Melvet and Rockson.">

    <div class="env" data-env aria-hidden="true">
      <img class="env-interior" src="assets/img/interior.webp" alt="">
      <div class="pocket">
        <img class="pocket-card" data-pocket-card src="assets/img/invite.webp" alt="">
      </div>
      <img class="env-body" src="assets/img/body.webp" alt="">
      <img class="env-margin" data-margin src="assets/img/margin.webp" alt="">
      <img class="env-click" data-click src="assets/img/click.webp" alt="">
      <div class="flap" data-flap>
        <img class="flap-face flap-face--front" src="assets/img/flap.webp" alt="">
        <img class="flap-face flap-face--back" src="assets/img/flap-back.webp" alt="">
      </div>
      <span class="seal-hint" data-seal-hint><span class="seal-glint"></span></span>
    </div>

    <button type="button" class="open-btn" data-open aria-label="Open the invitation"></button>
  </div>

  <!-- Inside: the invitation card, then the countdown -->
  <section class="reveal" data-reveal aria-label="Invitation" hidden>
    <div class="reveal-inner">
      <figure class="invite" data-invite>
        <img src="assets/img/invite.webp" width="1440" height="2560" alt="I have found the one whom my soul loves, Song of Solomon 3:4. Melvet Gonsalves and Rockson D'souza. Saturday 28 November, 7 PM. Holy Mass 4:30 PM, Infant Jesus Church, Dombivli. Join us in celebrating our love!">
        <a class="invite-map" data-map target="_blank" rel="noopener" aria-label="Open Infant Jesus Church, Dombivli in Google Maps"></a>
      </figure>

      <div class="details">
        <h1 class="script" data-step style="--d:0" data-count-title>Until we say I do</h1>

        <div class="countdown" data-step style="--d:1" role="timer" aria-label="Time left until the wedding">
          <div class="unit"><span class="num" data-unit="days">--</span><span class="lbl">Days</span></div>
          <span class="rule" aria-hidden="true"></span>
          <div class="unit"><span class="num" data-unit="hours">--</span><span class="lbl">Hours</span></div>
          <span class="rule" aria-hidden="true"></span>
          <div class="unit"><span class="num" data-unit="minutes">--</span><span class="lbl">Minutes</span></div>
          <span class="rule" aria-hidden="true"></span>
          <div class="unit"><span class="num" data-unit="seconds">--</span><span class="lbl">Seconds</span></div>
        </div>

        <div class="actions" data-step style="--d:2">
          <a class="btn" data-map target="_blank" rel="noopener">Get directions</a>
          <a class="btn btn--ghost" data-calendar target="_blank" rel="noopener">Save the date</a>
        </div>

        <button type="button" class="replay" data-step style="--d:3" data-replay>Open the envelope again</button>
      </div>
    </div>
  </section>
</main>

<canvas class="sparkle" data-sparkle aria-hidden="true"></canvas>

<noscript>
  <style>.scene,.sparkle{display:none}</style>
  <div class="noscript"><img src="assets/img/cover.webp" alt=""><img src="assets/img/invite.webp" alt=""></div>
</noscript>

<!--CONTENT-END-->
<script src="assets/js/card.js" defer></script>
</body>
</html>
