<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" />
    <meta name="description" content="YAKUZA — underground Y2K streetwear. Built after midnight. Worn at full speed." />
    <title>YAKUZA Drop 01</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2307080a'/%3E%3Cpath d='M8 12 36 24 50 46 64 24 92 12 60 58 60 92 40 98 40 58Z' fill='%23d8dde4'/%3E%3C/svg%3E" />
  </head>
  <body class="is-booting">
    <!-- WebGL environment: background, chrome logo, hero reveal -->
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- Boot / loading screen -->
    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot__top"><span>YKZ-OS v2.0.0.0</span><span class="boot__clock" data-clock>--:--:--</span></div>
      <div class="boot__log" id="bootLog"></div>
      <div class="boot__bar"><i id="bootBar"></i></div>
      <div class="boot__start" id="bootStart" aria-live="polite"></div>
      <div class="boot__meta"><span id="bootPct">000%</span><span class="boot__tip">TIP — The city reacts to speed. Scroll fast.</span></div>
    </div>

    <!-- Intro transmission (name in 22 scripts) -->
    <div class="tx" id="tx" aria-hidden="true"></div>

    <!-- Cursor -->
    <div class="cursor" id="cursor" aria-hidden="true">
      <div class="cursor__ring"><span class="cursor__label" id="cursorLabel">VIEW<br />PIECE</span></div>
      <div class="cursor__dot"></div>
    </div>

    <!-- Floating navigation (rendered by ui/nav.js) -->
    <header class="nav" id="nav"></header>

    <!-- HUD -->
    <div class="hud" id="hud" aria-hidden="true"></div>

    <main id="main">
      <!-- 01 — INTRO -->
      <section class="hero" id="intro" data-theme="hero" data-label="01 — INTRO"></section>
      <!-- 02 — COLLECTION INTRO -->
      <section class="manifesto" id="collection" data-theme="manifesto" data-label="02 — THE BLACKLIST"></section>
      <!-- 03–06 — CATEGORIES (rendered from data) -->
      <div id="categories"></div>
      <!-- 07 — FEATURED -->
      <section class="featured" id="featured" data-theme="pursuit" data-label="07 — MOST WANTED"></section>
      <!-- 08 — BRAND STATEMENT -->
      <section class="statement" id="statement" data-theme="statement" data-label="08 — STATEMENT"></section>
      <!-- 09 — FOOTER -->
      <footer class="footer" id="footer" data-theme="footer" data-label="09 — END"></footer>
    </main>

    <!-- Overlays -->
    <div class="piece-overlay" id="pieceOverlay" role="dialog" aria-modal="true" aria-hidden="true"></div>
    <aside class="bag" id="bag" aria-hidden="true"></aside>
    <div class="index-overlay" id="indexOverlay" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="grain" aria-hidden="true"></div>
    <noscript><p style="color:#fff;padding:2rem">YAKUZA needs JavaScript enabled.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
