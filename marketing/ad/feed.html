<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Gokudo feed ad</title>
<style>
  /*
    Gokudo feed ad, 1080 x 1350 (4:5).
    Sparks are drawn on a canvas in code; export.mjs renders the PNG and MP4.
  */
  @font-face {
    font-family: "Geist";
    src: url("fonts/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("fonts/GeistMono-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root {
    --bg: #0e0e0d;
    --ink: #ebeae5;
    --muted: #a19f97;
    --line: rgb(235 234 229 / 0.14);
    --accent: #e5553a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    color: var(--ink);
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame {
    position: absolute;
    inset: 0;
    padding: 80px 88px 84px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .mark { display: inline-flex; align-items: center; gap: 16px; }
  .mark i { width: 22px; height: 22px; background: var(--accent); display: block; }
  .mark span { font-size: 27px; font-weight: 600; letter-spacing: 0.3em; }
  .kicker { font-size: 22px; color: var(--muted); }
  .copy { align-self: center; max-width: 760px; }
  h1 {
    font-size: 168px;
    line-height: 0.92;
    font-weight: 600;
    letter-spacing: -0.05em;
  }
  h1 .line { display: block; overflow: hidden; padding-bottom: 6px; }
  h1 .line > span { display: block; will-change: transform; }
  h1 .accent { color: var(--accent); }
  .sub {
    margin-top: 44px;
    max-width: 30ch;
    font-size: 32px;
    line-height: 1.4;
    color: var(--muted);
  }
  .bottom {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 40px;
    padding-top: 40px;
    border-top: 1px solid var(--line);
  }
  .facts { display: grid; grid-template-columns: auto auto; gap: 56px; }
  .fact dt { font-size: 20px; color: var(--muted); }
  .fact dd { margin-top: 8px; font-size: 30px; font-weight: 500; }
  .fact dd b { font-family: "Geist Mono", monospace; font-weight: 500; }
  .cta {
    display: inline-flex;
    align-items: center;
    height: 84px;
    padding: 0 40px;
    background: var(--accent);
    color: var(--bg);
    font-size: 30px;
    font-weight: 600;
    white-space: nowrap;
  }
  [data-anim] { will-change: transform, opacity; }
</style>
</head>
<body>
<div class="ad">
  <canvas id="sparks" width="1080" height="1350" aria-hidden="true"></canvas>
  <div class="frame">
    <header class="top" data-anim="fade" data-at="0">
      <div class="mark"><i></i><span>GOKUDO</span></div>
      <p class="kicker">Japanese counter and grill</p>
    </header>

    <div class="copy">
      <h1 aria-label="Fish, rice and fire.">
        <span class="line"><span data-anim="rise" data-at="0.25">Fish, rice</span></span>
        <span class="line"><span data-anim="rise" data-at="0.4">and <span class="accent">fire.</span></span></span>
      </h1>
      <p class="sub" data-anim="fade" data-at="1.1">
        Omakase at a twelve-seat hinoki counter. Robata over binchotan, cooked to order.
      </p>
    </div>

    <footer class="bottom" data-anim="fade" data-at="1.5">
      <dl class="facts">
        <div class="fact"><dt>Omakase</dt><dd><b>$185</b> per guest</dd></div>
        <div class="fact"><dt>Seatings</dt><dd>6:00 and 8:30 pm</dd></div>
      </dl>
      <span class="cta">Reserve a seat</span>
    </footer>
  </div>
</div>

<script>
  const W = 1080, H = 1350, ACCENT = [229, 85, 58];
  const canvas = document.getElementById("sparks");
  const ctx = canvas.getContext("2d");

  // Deterministic random so every render of time t is identical.
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

  // Sparks rise from a bed of charcoal along the bottom right.
  const sparks = Array.from({ length: 90 }, () => {
    const x = W * (0.42 + Math.pow(rand(), 0.7) * 0.6);
    return {
      x,
      size: 3 + Math.pow(rand(), 2.2) * 22,
      speed: 0.07 + rand() * 0.13,
      phase: rand(),
      sway: 10 + rand() * 30,
      swayRate: 0.6 + rand() * 1.2,
      spin: (rand() - 0.5) * 1.6,
    };
  });

  const embers = Array.from({ length: 34 }, (_, i) => ({
    x: W * 0.36 + i * (W * 0.66 / 34) + rand() * 10,
    w: 18 + rand() * 26,
    h: 8 + rand() * 14,
    rate: 0.5 + rand() * 1.4,
    phase: rand() * Math.PI * 2,
  }));

  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 4);

  function drawSparks(t) {
    ctx.clearRect(0, 0, W, H);
    const base = H - 64;

    for (const e of embers) {
      const pulse = 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(t * e.rate * 2 + e.phase));
      ctx.fillStyle = `rgba(${ACCENT.join(",")},${pulse})`;
      ctx.fillRect(e.x, base - e.h + 40, e.w, e.h);
    }

    for (const s of sparks) {
      const p = (s.phase + t * s.speed) % 1;
      const y = base - p * (H * 0.95);
      const x = s.x + Math.sin(t * s.swayRate + s.phase * 6) * s.sway * p;
      const alpha = Math.pow(1 - p, 1.6) * 0.9;
      const size = s.size * (1 - p * 0.55);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(s.spin * t + s.phase * 3);
      ctx.fillStyle = `rgba(${ACCENT.join(",")},${alpha})`;
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.restore();
    }

    // Keep the type side calm: fade sparks out toward the left.
    const g = ctx.createLinearGradient(0, 0, W * 0.6, 0);
    g.addColorStop(0, "rgba(14,14,13,0.9)");
    g.addColorStop(1, "rgba(14,14,13,0)");
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W * 0.6, H);
    ctx.globalCompositeOperation = "source-over";
  }

  const animated = [...document.querySelectorAll("[data-anim]")];

  function drawType(t) {
    for (const el of animated) {
      const k = ease((t - Number(el.dataset.at)) / 0.9);
      if (el.dataset.anim === "rise") {
        el.style.transform = `translateY(${(1 - k) * 105}%)`;
      } else {
        el.style.opacity = k;
        el.style.transform = `translateY(${(1 - k) * 18}px)`;
      }
    }
  }

  // Exposed so the export script can render exact frames.
  window.renderFrame = (t) => {
    drawSparks(t);
    drawType(t);
  };

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (new URLSearchParams(location.search).has("export")) {
    window.renderFrame(0);
  } else if (reduce) {
    window.renderFrame(4.5);
  } else {
    const start = performance.now();
    const loop = (now) => {
      window.renderFrame((now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
